version: 2
default_request_interval_seconds: 3
collector_engine:
  production: scrapy
  local: web_adapter
  migration_status: planned
  default_render_mode: static_then_crawl4ai
  robots_obey: true
  concurrent_requests_per_domain: 1
  download_delay_seconds: 3
  autothrottle: true
  playwright_public_pages_only: true
cadence_tiers:
  daily:
    interval_seconds: 86400
    description: 每日检查
  weekly:
    interval_seconds: 604800
    description: 每周检查
  monthly:
    interval_seconds: 2592000
    description: 每月检查
  semiannual:
    interval_seconds: 15552000
    description: 每半年检查
  annual:
    interval_seconds: 31536000
    description: 每年检查
  irregular:
    interval_seconds: 604800
    description: 无固定发布规律，按周探测并使用条件请求
  static:
    interval_seconds: 7776000
    description: 长期稳定内容，按季度复核
retention_policies:
  transient:
    days: 30
    description: 活动、短期通知和时效性信息
  active:
    days: 365
    description: 当前仍可能影响用户决策的信息
  policy:
    days: 1095
    description: 政策、法规、公告和历史制度资料
  historical:
    days: 3650
    description: 经批准长期保存的历史资料
  permanent:
    days: null
    description: 仅经负责人和合规批准的长期资料，默认不保存原始全文
source_groups:
  ministries: enabled
  provincial: pending_review
  municipal: pending_review
  county: partial
  official_media: pending_review
  province: expanding
  municipality: expanding
county_source_policy:
  enabled: true
  required_fields:
  - id
  - name
  - domain
  - url
  - region_province
  - region_city
  - region_county
  level: county
  gov_level: 县级
  status: partial
  sources: []
  note: 2026-09-25 实测：成都多数区县站点对静态请求返回 412（JS 挑战）。经 §3.1 playwright_fallback 渲染路径验证，cdjinjiang.gov.cn 3/3 稳定可用并已启用；cdwh.gov.cn 0/3 保持 blocked。行政区划代码取自国标码，仅作登记，不构成对该站点的采信。
  probed_at: '2026-09-25'
  probed_results:
  - id: cd_wuhou_gov
    name: 成都市武侯区人民政府
    domain: cdwh.gov.cn
    http_status: 412
    usable_pages: 0/3
    status: blocked
    reason: 首页在 Playwright 渲染下 3/3 返回 39 字节挑战残页，公开列表不可稳定获取；按 §3.2 收到明确限制后不得继续试探。
  verified_codes:
    锦江区: '510104'
    武侯区: '510107'
    青羊区: '510105'
    金牛区: '510106'
    成华区: '510108'
    龙泉驿区: '510112'
    青白江区: '510113'
    新都区: '510114'
    温江区: '510115'
    双流区: '510116'
    郫都区: '510117'
    新津区: '510118'
    简阳市: '510121'
    都江堰市: '510181'
    彭州市: '510182'
    邛崃市: '510183'
    崇州市: '510184'
    金堂县: '510129'
    大邑县: '510131'
    蒲江县: '510132'
media_source_policy:
  enabled: true
  allowed_source_types:
  - official_media
  - mainstream_media
  - industry_media
  required_review: true
  require_original_reporting: true
  allow_downloadable_documents: true
  prohibited:
  - social_media
  - user_generated
  - advertising
  - entertainment
  - aggregator
  hot_topic_vocabulary:
  - Agent
  - B300
  - GPU
  - 芯片
  - 半导体
  - 人工智能
  - 算力
  - 数据中心
  - 机器人
  - 新能源
  - 光伏
  - 储能
  - 电池
  - 电力
  - 低空经济
  note: 主流媒体和行业媒体只能作为逐源审核的交叉验证来源，不替代政府原始公告
critical_sources:
- ndrc_gov
- nea_gov
- sc_ndrc_gov
- sc_energy_gov
project_tracking:
  enabled: true
  source_role: development_reform_commission
  source_levels:
  - national
  - provincial
  - municipal
  tags:
  - 重大项目
  - 项目申报
  - 项目核准
  - 项目备案
  - 项目批复
  - 中央预算内投资
  - 地方政府专项债
  - 重点项目
  - 开工
  - 竣工
  - 产业基金
  - 设备更新
  stages:
  - 谋划
  - 申报
  - 立项
  - 建设
  - 投产
  - 验收
  reason: 发改项目主线：{matched_tag}
official_media_policy:
  allowed: true
  source_type: official_media
  original_content_required: true
  project_progress_focus: true
  excluded:
  - social_platform
  - repost
  - entertainment_only
  - advertising
  - user_generated_comment
forge_rss:
  enabled: false
  endpoint: null
  policy: 仅允许本地或已审核端点；禁止反爬绕过、登录态和社交平台转换
crawl4ai:
  enabled: true
  remove_overlay_elements: true
  pruning_threshold: 0.48
  threshold_type: fixed
  wait_for: css:body
  page_timeout: 30000
  check_robots_txt: true
  cache_mode: bypass
  browser_channel: msedge
  headless: true
  minimum_content_chars: 80
