version: 1
note: |
  主管部门 → 分类映射。主管部门比标题关键词可靠得多：发文机关决定了这份文件
  属于哪个业务口。命中后直接决定分类，不再依赖标题词表。
  匹配顺序：先 department_map（部门全名/简称），再 sector_map（业务口），
  都没命中才回落到 category_rules.yaml 的关键词规则。
  未命中任何规则的记录标记 retention_class: transient（30 天后自动清理）。

