general:
  project_root: .
  markdown_dir: data/markdown
  report_dir: data/runtime/lighthouse
quality:
  min_content_chars: 800
  min_summary_chars: 200
  max_chrome_ratio: 0.03
  max_link_ratio: 0.25
  max_toc_run: 8
  chrome_patterns:
  - 上一篇
  - 下一篇
  - 返回顶部
  - 网站标识码
  - 版权所有
  - 联系我们
  - 网站地图
  - 友情链接
  - 打印本页
  - 关闭窗口
  - 字号：大 中 小
  - 扫一扫在手机打开当前页
  - 分享到：
  - 无障碍
  - 设为首页
  - 繁體
  - 繁体
  - 长者专区
  - 网站支持IPv6
  - 旧版回顾
  - RSS订阅
  - 当前位置：
  - 网站首页
  - 扫一扫.{0,6}手机.{0,4}当前页
  - ^\*+$
  toc_patterns:
  - ^目\s*录
  - ^附\s*件
  - ^索\s*引
  - ^抄\s*送
  - ^主题词
  - ^来源[:：]
  - ^-{3,}\s*\d+\s*-{3,}\s*$
  - ^\d+\s*-\s*\d+\s*$
routes:
  archive_pages: 60
  max_items: 2000
  max_stale_pages: 150
  levels:
  - name: rss
    cost: 1
    enabled: false
    desc: 源配了 rss_url 才走
  - name: api
    cost: 1
    enabled: false
    desc: 源配了 list_endpoint 且拿到 >=3 条才走
  - name: static
    cost: 3
    enabled: true
    desc: httpx + trafilatura，主力路径
    timeout_seconds: 30
  - name: render
    cost: 30
    enabled: true
    desc: cloakbrowser + playwright，独立 worker 进程
    wait_until: networkidle
    timeout_ms: 60000
    settle_ms: 5000
  - name: markdown
    cost: 50
    enabled: true
    desc: crawl4ai fit_markdown，最后手段
    timeout_ms: 60000
    chrome_channel: msedge
  - name: pdf
    cost: 10
    enabled: true
    desc: 页面正文只在 PDF 附件里时走
    max_bytes: 20971520
collect_defaults:
  archive_pages: 30
  max_items: 600
  raise_archive_pages_below: 30
  raise_max_items_below: 600
rate_limit:
  per_source_interval_seconds: 3
  gov_domain_extra_seconds: 2
  workers: 6
  source_budget_seconds: 1800
  stall_source_budget_seconds: 420
  deep_source_budget_seconds: 1500
collect_scope:
  exclude:
  - 香港特别行政区
  - 澳门特别行政区
  include:
    gov_level:
    - 国家部委
    - 省级
    - 直辖市
    - 市级
    - 县级
    - 特别行政区
    region:
    - 北京市
    - 上海市
    - 广州市
    - 深圳市
    - 成都市
    - 重庆市
    - 浙江省
    - 江苏省
    - 武汉市
  scope_note_2026_10_02: 项目负责人决定全开：145 个源全部启用，白名单同步放开到全部层级。改动前只放行「国家部委 + 9 个城市」，145
    个源里有 101 个不在白名单内 —— 配置说全开、白名单只认 34 个，范围就漂移了。
focus_order:
- gov_level:
  - 国家部委
- region:
  - 北京市
  - 上海市
  - 广州市
  - 深圳市
- region:
  - 江苏省
  - 浙江省
- region:
  - 成都市
  - 武汉市
  - 重庆市
- source_type:
  - university
  - military_recruitment
- functions_any:
  - 公招信息
  - 招聘信息
  - 招生政策
  - 招生信息
  - 教育通知
summary:
  max_chars: 300
  lead_window_sentences: 8
  min_sentence_chars: 15
  max_sentence_chars: 230
  terminators: 。！？；
  prefix_facts: true
  amount_junk_patterns:
  - ^\d{4}$
  - ^\d{1,2}$
  - ^0$
  - ^\d{1,3}%$
